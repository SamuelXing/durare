# Local tracing stack for the `telemetry` example; see examples/telemetry/main.rs.
# Ports bind to loopback only.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "127.0.0.1:4318:4318" # OTLP/HTTP, where the example sends spans
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "127.0.0.1:3200:3200" # Tempo API, used by Grafana

  grafana:
    image: grafana/grafana:12.4.14
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/tempo.yaml:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - tempo
